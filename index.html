<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Solver</title>
    <meta name="description" content="Interactive, accessible Sudoku tool that explains the solve step by step, animated on the grid." />
    <meta name="theme-color" content="#1a1916" />
    <link rel="canonical" href="https://sudoku-solver.rodrigogomes.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sudoku Solver" />
    <meta property="og:description" content="Interactive, accessible Sudoku tool that explains the solve step by step, animated on the grid." />
    <meta property="og:url" content="https://sudoku-solver.rodrigogomes.dev/" />
    <meta property="og:image" content="https://sudoku-solver.rodrigogomes.dev/thumbnail.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      (function () {
        var saved = localStorage.getItem('theme')
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = saved || system
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
